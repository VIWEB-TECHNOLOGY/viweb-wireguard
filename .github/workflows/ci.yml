name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: node --test tests/*.test.mjs

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Admin UI bound to loopback only
        run: |
          docker compose config --format json \
            | jq -e '[.services["wg-easy"].ports[] | select(.target == 51821)] | all(.host_ip == "127.0.0.1")'
      # Build only; nothing is pushed and no registry credentials are used.
      - name: Build image
        run: docker build -t viweb-wireguard:ci .
