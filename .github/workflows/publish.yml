name: Publish image

# Publishes ghcr.io/<owner>/<repo>:<version> for pushed v* tags only.
# No latest or branch tags are ever pushed. Package visibility is managed in
# the GitHub package settings, not here.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Validate tag and derive version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Publishing is only allowed from a tag ref" >&2
            exit 1
          fi
          if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-mtu[0-9]+$'; then
            echo "::error::Tag must look like v15.4.0-mtu1412" >&2
            exit 1
          fi
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Compose config (published image and source override)
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
      - name: Admin UI bound to loopback only
        run: |
          docker compose config --format json \
            | jq -e '[.services["wg-easy"].ports[] | select(.target == 51821)] | all(.host_ip == "127.0.0.1")'
      - name: compose.yaml references the tag being published
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker compose config --format json \
            | jq -e --arg ref "$IMAGE:$VERSION" '.services["wg-easy"].image == $ref'

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.version }}
            ${{ needs.verify.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
